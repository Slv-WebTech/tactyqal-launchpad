version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(api)" }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(web)" }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(e2e)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
